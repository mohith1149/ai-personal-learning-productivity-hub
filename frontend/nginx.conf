server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # AI replies can take a while
    }

    # The public progress page is rendered by the backend.
    location /share/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built files have hashed names: cache them. index.html must always be fetched fresh so a new build is picked up.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The app has client-side routes such as /reports: anything else loads the app.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
